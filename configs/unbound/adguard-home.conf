server:
    interface: 127.0.0.1
    port: 5335

    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    access-control: 127.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse

    root-hints: "/usr/share/dns/root.hints"
    num-threads: 1
    msg-cache-size: 8m
    rrset-cache-size: 16m

    qname-minimisation: yes
    aggressive-nsec: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    hide-identity: yes
    hide-version: yes
    minimal-responses: yes
    edns-buffer-size: 1232

    prefetch: yes
    serve-expired: yes
    serve-expired-ttl: 3600
    cache-min-ttl: 60
    cache-max-ttl: 86400

    verbosity: 1
    log-queries: no
    log-replies: no
